[project]
name = "cliffguard"
version = "0.0.1"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy",
    "scipy",
    "pydantic>=2.0",
    "datasets",
    "jsonlines",
    "matplotlib",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
]
gpu = [
    "torch",
    "transformers",
    "bitsandbytes",
    "accelerate",
    "sentencepiece",
    "autoawq ; sys_platform == 'linux'",
    "vllm ; sys_platform == 'linux'",
    "llama-cpp-python",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
# Notebook cells are not modules. A setup cell must clone the repo and extend
# sys.path BEFORE it can import anything from it, so E402 is unavoidable there,
# and grouped imports (E401) are the normal idiom for a cell that just gets the
# environment ready. Everything else -- undefined names, unused imports, shadowed
# builtins -- stays enforced, because those are real bugs in a notebook too.
"*.ipynb" = ["E401", "E402"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["cliffguard.engines.*", "torch", "transformers", "bitsandbytes", "accelerate", "awq", "vllm", "llama_cpp", "gguf", "gguf.*", "huggingface_hub", "scipy", "scipy.stats", "matplotlib", "matplotlib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
