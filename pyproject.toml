[project]
name = "cliffguard"
version = "0.0.1"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy",
    "scipy",
    "pydantic",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
]
gpu = [
    "torch",
    "transformers",
    "bitsandbytes",
    "accelerate",
    "sentencepiece",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[tool.ruff]
line-length = 100

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["cliffguard.engines.*", "torch", "transformers", "bitsandbytes", "accelerate"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
