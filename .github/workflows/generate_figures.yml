name: Generate Paper Figures

on:
  push:
    branches: [main]
    paths:
      - "docs/paper/figures/generate_figures.py"
  pull_request:
    branches: [main]
    paths:
      - "docs/paper/figures/generate_figures.py"
  workflow_dispatch:

jobs:
  generate-figures:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install matplotlib numpy scipy

      - name: Generate figures
        run: python docs/paper/figures/generate_figures.py

      - name: Upload figures as artifact
        uses: actions/upload-artifact@v4
        with:
          name: paper-figures
          path: |
            docs/paper/figures/*.png
            docs/paper/figures/*.pdf
          retention-days: 90

      - name: Commit updated PNG figures
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/paper/figures/*.png
          if git diff --cached --quiet; then
            echo "No figure changes to commit."
          else
            git commit -m "ci: regenerate paper figures [skip ci]"
            git push
          fi
